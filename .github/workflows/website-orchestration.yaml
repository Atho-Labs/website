name: "Deploy Now: Orchestration"
run-name: "Deploy Now: Build website · ${{ github.event.head_commit.message || format('Triggered by {0}', github.triggering_actor) }}"

on:
  - push
  - workflow_dispatch

permissions:
  actions: read
  contents: read

env:
  IONOS_PROJECT_ID: 79353570-e96a-4640-8783-5cf9b2c93269
  IONOS_DEPLOYMENT_ID: 7c7c52a5-5adb-4d5f-bbad-5cf1a941f0e0

jobs:
  retrieve-project:
    name: check readiness
    runs-on: ubuntu-latest
    outputs:
      deployment-enabled: ${{ steps.normalize.outputs.deployment-enabled }}
      branch-id: ${{ steps.normalize.outputs.branch-id }}
    steps:
      - name: Fetch project data
        uses: ionos-deploy-now/project-action@v1.2.1-beta2
        id: project
        continue-on-error: true
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ env.IONOS_PROJECT_ID }}
          action: retrieve-info

      - name: Normalize project outputs
        id: normalize
        if: ${{ always() }}
        env:
          PROJECT_INFO: ${{ steps.project.outputs.info }}
        run: |
          python3 - <<'PY'
          import json
          import os

          info = (os.getenv("PROJECT_INFO") or "").strip()
          data = {}

          if info:
            try:
              data = json.loads(info)
            except Exception:
              data = {}

          deployment_enabled = str(data.get("deployment-enabled", "false")).lower()
          branch_id = str(data.get("branch-id", ""))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"deployment-enabled={deployment_enabled}\n")
            fh.write(f"branch-id={branch_id}\n")
          PY

      - name: Fail with clear IONOS error
        if: ${{ steps.project.outcome != 'success' }}
        run: |
          echo "::error::IONOS Deploy Now project lookup failed. Check secrets.IONOS_API_KEY and confirm the IONOS project is still linked to the main branch in Deploy Now."
          echo "Expected git ref: ${GITHUB_REF_NAME}"
          exit 1

  build:
    name: build
    needs: retrieve-project
    if: ${{ needs.retrieve-project.outputs.deployment-enabled == 'true' && needs.retrieve-project.outputs.branch-id != '' }}
    uses: ./.github/workflows/website-build.yaml
    with:
      site-url: https://IONOS_DEPLOY_NOW_SITE_URL
      branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
    secrets: inherit

  deploy:
    name: deploy to IONOS
    needs:
      - retrieve-project
      - build
    if: ${{ needs.retrieve-project.outputs.deployment-enabled == 'true' && needs.retrieve-project.outputs.branch-id != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update deployment status
        uses: ionos-deploy-now/project-action@v1.2.1-beta2
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ env.IONOS_PROJECT_ID }}
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          deployment-id: ${{ env.IONOS_DEPLOYMENT_ID }}
          action: update-status
          status: in_progress

      - name: Retrieve stored deployment
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ env.IONOS_PROJECT_ID }}
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          version: ${{ github.sha }}
          action: download

      - name: Fetch deployment info
        uses: ionos-deploy-now/project-action@v1.2.1-beta2
        id: deployment
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ env.IONOS_PROJECT_ID }}
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          deployment-id: ${{ env.IONOS_DEPLOYMENT_ID }}
          action: retrieve-info

      - name: Render templates
        uses: ionos-deploy-now/template-renderer-action@v2
        with:
          deployment-id: ${{ env.IONOS_DEPLOYMENT_ID }}
          data: "[${{ steps.deployment.outputs['template-variables'] }}, ${{ toJSON(secrets) }}]"
          input-directory: deployment
          output-directory: deployment
          intermediate-data-file: deployment/.template-renderer-data

      - name: Render real site-url to all files
        run: |
          grep -rl 'https://IONOS_DEPLOY_NOW_SITE_URL' deployment | while IFS= read -r file; do
            sed -i -e 's|https://IONOS_DEPLOY_NOW_SITE_URL|${{ fromJSON(steps.deployment.outputs.info)['site-url'] }}|g' "$file"
          done

      - name: Render SSH user secret name
        run: |
          deployment_key=$(printf '%s' "$IONOS_DEPLOYMENT_ID" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
          echo "SSH_USERNAME_SECRET=IONOS_DEPLOYMENT_${deployment_key}_SSH_USERNAME" >> "$GITHUB_ENV"

      - name: Deploy to IONOS
        uses: ionos-deploy-now/deploy-to-ionos-action@v2
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ env.IONOS_PROJECT_ID }}
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          deployment-id: ${{ env.IONOS_DEPLOYMENT_ID }}
          deployment-info: ${{ steps.deployment.outputs.info }}
          ssh-user: ${{ secrets[env.SSH_USERNAME_SECRET] }}
          ssh-key: ${{ secrets.IONOS_SSH_KEY }}

      - name: Update deployment status
        if: ${{ always() }}
        uses: ionos-deploy-now/project-action@v1.2.1-beta2
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ env.IONOS_PROJECT_ID }}
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          deployment-id: ${{ env.IONOS_DEPLOYMENT_ID }}
          action: update-status
          status: ${{ job.status }}

      - name: Notify deployment finished
        if: ${{ always() }}
        uses: ionos-deploy-now/project-action@v1.2.1-beta2
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ env.IONOS_PROJECT_ID }}
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          action: set-deployments-finished
